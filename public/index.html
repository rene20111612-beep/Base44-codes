<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulpo DJ — sesión de viernes</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #f5f0ff;
    background:
      radial-gradient(900px 520px at 18% 8%, rgba(255, 79, 200, .30), transparent 60%),
      radial-gradient(800px 520px at 84% 92%, rgba(0, 229, 255, .24), transparent 62%),
      linear-gradient(160deg, #120b24 0%, #1b0f33 45%, #0a0714 100%);
  }
  main { width: min(1000px, 100%); }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(28px, 5vw, 52px);
    letter-spacing: -.02em;
    line-height: 1.05;
    background: linear-gradient(95deg, #ffd400, #ff6fb5 55%, #7af0ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.sub { margin: 0 0 22px; color: #c3b6e0; font-size: clamp(14px, 2vw, 17px); }
  .player {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    background: #05030c;
    box-shadow: 0 26px 70px rgba(0, 0, 0, .65), 0 0 0 1px rgba(255, 255, 255, .10);
  }
  video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #05030c; }
  .meta {
    display: flex; flex-wrap: wrap; gap: 10px 18px;
    margin-top: 16px; font-size: 13px; color: #9d90bd;
  }
  .pill {
    padding: 5px 12px; border-radius: 999px;
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .10);
  }
</style>
</head>
<body>
<main>
  <h1>Pulpo DJ</h1>
  <p class="sub">Sesión de viernes · dale al play 🔊</p>
  <div class="player">
    <video id="v" src="/pulpo-dj.mp4" poster="/poster.jpg" controls playsinline preload="metadata"></video>
  </div>
  <div class="meta">
    <span class="pill">30 s</span>
    <span class="pill">1280 × 720</span>
    <span class="pill">Música original</span>
  </div>
</main>
</body>
</html>
